<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Territory Report</title>

    <style>
 body { 
            font-family: 'Times New Roman', serif;

.header-box {

}

.back-link {

    top: 20px; 
    left: 20px; 
    text-decoration: none; 
    color: #27ae60; 
    font-weight: bold;

}

.btn-print { 
    position: absolute;

    right: 20px;

    color: white;

    padding: 8px 15px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: bold; 
}

        h2 { color: #2c3e50; margin: 0; }

table {
    width: 80% !important; /* Neenga ketta 90% width */
    margin: 20px auto;
    border-collapse: separate;
    border-spacing: 0;
    /* 🥂 Perfect Glass Effect */
    background: rgba(255, 255, 255, 0.15); 
    backdrop-filter: blur(20px);

    border-radius: 25px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

/* Header - Yellow-ku badhula Professional Navy */
th {
    background: yellow;
    color: black;
    padding: 18px;
    text-transform: uppercase;
    font-size: 17px;
    letter-spacing: 1.5px;
    border: none;
}

/* Data Rows */
td {
    padding: 15px;
    color: #1a1a1a; /* Dark text for readability */
    font-weight: 600;
    font-size: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

/* Row Hover Effect */
tr:hover {
    background: rgba(255, 255, 255, 0.2);
    transition: 0.3s;
}

@media print {
    /* 1. பேக்ரவுண்ட் இமேஜை முழுமையாக நீக்க */
    body::before, body {
        background: none !important;
        background-image: none !important;
        background-color: white !important;
    }

    /* 2. பட்டன்கள் மற்றும் தேவையற்றவற்றை மறைக்க */
    .btn-print, .back-link, .top-left, .top-right, .tool-row { 
        display: none !important; 
    }

    /* 3. கலர் மட்டும் வர இது முக்கியம் */
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    /* 4. ஹெடர் மற்றும் டேபிள் செட்டிங்ஸ் */
    .main-wrapper, .container {
        background: white !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
    }

    .master-header-box {
        border: 2px solid black !important;
        box-shadow: none !important;

    /* 5. தலைப்பு - இங்கே SHADE நீக்கப்பட்டுள்ளது */
    h1 {
        color: green !important;
        text-shadow: none !important; /* 👈 ஷேடோ வராது */
    }

    /* 6. டேபிள் பார்டர்கள் மற்றும் மஞ்சள் நிறம் */
    table {
        border-collapse: collapse !important;

    }

    th {
        background-color: yellow !important; /* 👈 பிரிண்டில் மஞ்சள் நிறம் தெரியும் */
        color: black !important;
        border: 1px solid black !important;
    }

    td {
        border: 1px solid black !important;
        color: black !important;
    }
}
    </style>
</head>

<div id="salesReportPage" style="display: none; background: white; padding: 25px; border-radius: 25px; text-align: center; width: 100% !important; max-width: 100% !important; box-sizing: border-box; margin-top: 20px;">

    <!-- Wide Dimension Matrix Table (Yellow Background Headers with Green Outlines) -->

                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Brand Name</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Article No</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Product Name</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Price</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Qty/Mo</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Month Qty</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Total Value</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Achieved Value</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Balance</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Handled By</th>
                <th style="border: 1px solid #27ae60 !important; padding: 15px; font-size: 14px; color: black !important; font-weight: bold; font-family: 'Times New Roman'; background: #ffea00 !important; text-align: center; letter-spacing: 0px;">Remarks</th>

                <td colspan="7" style="text-align: right; padding: 14px; border: 1px solid #27ae60; color: white; font-family: 'Times New Roman'; background: #27ae60 !important;">GRAND TOTAL:</td>
                <td id="vimagGkGTotalVal" style="border: 1px solid #27ae60; padding: 14px; text-align: center; color: white; font-family: 'Times New Roman'; font-weight: bold; background: #27ae60 !important;">€ 0.00</td>
                <td id="vimagGkGAchievedVal" style="border: 1px solid #27ae60; padding: 14px; text-align: center; color: white; font-family: 'Times New Roman'; font-weight: bold; background: #27ae60 !important;">€ 0.00</td>
                <td id="vimagGkGBalanceVal" style="border: 1px solid #27ae60; padding: 14px; text-align: center; color: white; font-family: 'Times New Roman'; font-weight: bold; background: #27ae60 !important;">€ 0.00</td>
                <td colspan="2" style="border: 1px solid #27ae60; background: #27ae60 !important;"></td>

<!-- Firebase Scripts -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/4.2.0/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.10/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.10/firebase-database-compat.js"></script>

<script>
    // 1. Unga Firebase Config (Same as before)
    const firebaseConfig = { 
        apiKey: "AIzaSyBC9Ny5zLH2TBQK9r469OXAMeQ6AbiScn8", 
    databaseURL: "https://vimag-database-default-rtdb.firebaseio.com",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const brandsList = ["Rhodius", "Laco", "Lessmann", "Capital Weld Cleaners", "Dedeco", "Einhell", "Peddinghaus", "Rexcut", "Shannon", "Starrett", "Voelkel"];

    window.onload = async function() {
        // 2. URL-la irundhu Region pera edukkurom
        const params = new URLSearchParams(window.location.search);
        const region = params.get('region');

        if (!region) {
            document.getElementById('tableArea').innerHTML = "<h2>No region selected!</h2>";
            return;
        }

    document.getElementById('regionTitle').innerText = "💎 REGION: " + region.toUpperCase();

        try {
            // 3. Firebase path: vimag/brands (Lowercase check)
            const snapshot = await db.ref('vimag/brands').once('value');
            const allData = snapshot.val() || {};
            let resultsMap = {}; 

            // 4. Cloud logic: Scan all 11 brands to find matches
            brandsList.forEach(brand => {
                if (allData[brand]) {
                    Object.keys(allData[brand]).forEach(custName => {
                        const lock = allData[brand][custName]["_id_lock"];
                        if (lock && lock.region && lock.region.trim().toUpperCase() === region.trim().toUpperCase()) {
                            if (!resultsMap[custName]) resultsMap[custName] = [];
                            resultsMap[custName].push(brand.toUpperCase());
                        }
                    });
                }
            });

            const sortedNames = Object.keys(resultsMap).sort();

            if (sortedNames.length === 0) {
                document.getElementById('tableArea').innerHTML = `<h3 style="color:red; text-align:center;">No records found for ${region}!</h3>`;
                return;
            }

            // 5. Build Final Table with Borders
            let html = `<table>
                <thead>
                    <tr>
                        <th>S.NO</th>
                        <th>🏢 COMPANY NAME</th>
                        <th>📦 ACTIVE BRANDS</th>
                    </tr>
                </thead>
                <tbody>`;

            sortedNames.forEach((name, idx) => {
                var cleanSafeStringKey = btoa(unescape(encodeURIComponent(name)));

                html += `<tr>
                    <td align="center">${(idx + 1).toString().padStart(2, '0')}</td>
                   <td>
                        <span onclick="vimagOpenLiveSalesReport(decodeURIComponent(escape(atob('${cleanSafeStringKey}'))))" 
                              style="text-decoration:none; color:#c0392b; font-weight:bold; cursor:pointer;"
                              onmouseover="this.style.textDecoration='underline'; this.style.color='#962d22';" 
                              onmouseout="this.style.textDecoration='none'; this.style.color='#c0392b';">
                           🏢 ${name}
                        </span>
</td>
                    <td style="color:#2980b9;">📍 ${resultsMap[name].join(' | ')}</td>
                </tr>`;
            });

            document.getElementById('tableArea').innerHTML = html + "</tbody></table>";

        }

catch (e) {
            console.error(e);
            document.getElementById('tableArea').innerHTML = "<h3 style='color:red;'>Sync Error! Check Internet Connection.</h3>";
        }

    };
function vimagOpenLiveSalesReport(customerName) {
    if (!customerName) return;
    
    // Explicit array setup to prevent any blank page initialization crash variables
    const localSystemBrandsList = ["Rhodius", "Laco", "Lessmann", "Capital Weld Cleaners", "Dedeco", "Einhell", "Peddinghaus", "Rexcut", "Shannon", "Starrett", "Voelkel"];
    
    const headerBoxView = document.querySelector('.header-box');
    const currentMainTableView = document.querySelector('table');
    const salesReportView = document.getElementById('salesReportPage');
    const tbodyGrid = document.getElementById('vimagSalesContentGrid');
    const headerTitle = document.getElementById('vimagCustHeaderLabel');
    
    if(!salesReportView || !tbodyGrid) return;

    // ⚡ 1. View switches screen dynamic toggle layouts (Bypasses missing .container class conflict crashes)
    if(headerBoxView) headerBoxView.style.display = 'none';
    if(currentMainTableView) currentMainTableView.style.display = 'none';
    salesReportView.style.display = 'block';
    
    if(headerTitle) headerTitle.innerText = customerName;
    tbodyGrid.innerHTML = "<tr><td colspan='12' style='padding:30px; font-size:16px; color:#555; text-align:center; background:white; font-family:\"Times New Roman\";'>Generating Accurate Report From Cloud Data Store... ⚡</td></tr>";

    // 📡 FIREBASE REAL-TIME LISTENERS PIPELINE SYNC CONNECTION
    db.ref('vimag/brands').on('value', (snapshot) => {
        const allBrandsData = snapshot.val();
        
        let rowsHtml = ""; 
        let gTotalValue = 0, gAchievedValue = 0, gBalance = 0;
        let serialNo = 1;

        if (allBrandsData) {
            localSystemBrandsList.forEach(brand => {
                if (allBrandsData[brand] && allBrandsData[brand][customerName]) {
                    const customerData = Object.values(allBrandsData[brand][customerName]);
                    
                    customerData.forEach(item => {
                        // 🛡️ Accuracy filter checks
                        if (!item.artNo || item.id === "_id_lock" || item.id.startsWith("CUST-") || item.artNo === "SYSTEM") {
                            return; 
                        }

                        let price = parseFloat(item.price || 0);
                        let qtyMo = parseInt(item.qty || 0);
                        let monthQty = parseInt(item.monthQty || 0);
                        let currency = item.currency || "€"; 
                        
                        let totalValue = qtyMo * price;
                        let achievedValue = monthQty * price;
                        let balance = totalValue - achievedValue;

                        gTotalValue += totalValue;
                        gAchievedValue += achievedValue;
                        gBalance += balance;

                        rowsHtml += `
                        <tr style="border-bottom:1px solid #ddd; background:white; font-weight:normal;">
                            <td style="padding:14px; text-align:center; font-size:15px; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${serialNo++}</td>
                            <td style="font-weight:bold; color:#c2185b; padding:14px; text-align:center; font-size:15px; font-family:'Times New Roman'; border:1px solid #27ae60;">${brand}</td>
                            <td style="padding:14px; text-align:center; font-size:15px; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${item.artNo || '-'}</td>
                            <td style="text-align:left; padding:14px; font-size:15px; color:black; font-family:'Times New Roman'; font-weight:bold; border:1px solid #27ae60;">${item.name || '-'}</td>
                            <td style="padding:14px; text-align:center; font-size:15px; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${currency}${price.toFixed(2)}</td>
                            <td style="padding:14px; text-align:center; font-size:15px; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${qtyMo}</td>
                            <td style="padding:14px; text-align:center; font-size:15px; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${monthQty}</td>
                            <td style="color:#2980b9; font-weight:bold; padding:14px; text-align:center; font-size:15px; font-family:'Times New Roman'; border:1px solid #27ae60;">${currency}${totalValue.toFixed(2)}</td>
                            <td style="color:#27ae60; font-weight:bold; padding:14px; text-align:center; font-size:15px; font-family:'Times New Roman'; border:1px solid #27ae60;">${currency}${achievedValue.toFixed(2)}</td>
                            <td style="color:#e74c3c; font-weight:bold; padding:14px; text-align:center; font-size:15px; font-family:'Times New Roman'; border:1px solid #27ae60;">${currency}${balance.toFixed(2)}</td>
                            <td style="padding:14px; text-align:center; font-size:15px; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${item.handledBy || '-'}</td>
                            <td style="font-size:14px; padding:14px; text-align:left; color:black; font-family:'Times New Roman'; border:1px solid #27ae60;">${item.remarks || '-'}</td>
                        </tr>`;
                    });
                }
            });
        }

        tbodyGrid.innerHTML = rowsHtml || "<tr><td colspan='12' style='padding:30px; text-align:center; background:white; color:black; font-family:\"Times New Roman\"; font-weight:bold;'>No Product Entries Found for this Customer.</td></tr>";

        const fmt = (num) => num.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
        document.getElementById('vimagGkGTotalVal').innerText = "€ " + fmt(gTotalValue);
        document.getElementById('vimagGkGAchievedVal').innerText = "€ " + fmt(gAchievedValue);
        document.getElementById('vimagGkGBalanceVal').innerText = "€ " + fmt(gBalance);
    });
}

// ⬅️ HIDE ACTION (Fixed: Restoring original territory wrapper layouts properly without frame conflicts)
function hideSalesReportInline() {
    console.log("Sales inline view shutting down... Restoring central zonal directory grid... ⚡");

    document.getElementById('salesReportPage').style.display = 'none';
    
    const headerBoxView = document.querySelector('.header-box');
    const currentMainTableView = document.querySelector('table');

    if (headerBoxView) headerBoxView.style.display = 'block';           
    if (currentMainTableView) currentMainTableView.style.display = 'table'; 
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
